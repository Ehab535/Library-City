name: Build Android APK (City Library)

on:
  push:
    branches: [main, master, 'claude/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build web app
        env:
          # Optional: URL of the deployed server.ts so the AI assistant works in the app
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: npx vite build

      - name: Copy web app into the Android project
        run: npx cap sync android

      - name: Restore release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "Signing with the release key from secrets."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is not set. The APK is signed with a throwaway debug key, so Google sign-in will not work in it."
          fi

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Show signing certificate (SHA-1 must be registered in Firebase)
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $APKSIGNER verify --print-certs android/app/build/outputs/apk/release/app-release.apk | grep -E "SHA-1|SHA-256"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CityLibrary-APK
          path: android/app/build/outputs/apk/release/app-release.apk
