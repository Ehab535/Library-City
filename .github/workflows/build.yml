name: Build Android APK (City Library)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Detect Directory & Install Dependencies
        run: |
          # التاكد من وجود package.json ونقله للرئيسي اذا كان داخل مجلد فرعي
          if [ ! -f "package.json" ]; then
            SUBDIR=$(find . -maxdepth 2 -name "package.json" | head -n 1 | xargs dirname)
            if [ -n "$SUBDIR" ]; then
              echo "Fixing subfolder location from $SUBDIR"
              cp -r $SUBDIR/* .
            fi
          fi
          npm install --legacy-peer-deps

      - name: Build Web App
        run: npx vite build

      - name: Setup Capacitor Android App
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          npx cap init "City Library" "com.citylibrary.app" --web-dir dist
          npx cap add android
          npx cap copy android

      - name: Build APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CityLibrary-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
